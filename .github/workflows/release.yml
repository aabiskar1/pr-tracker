name: GitHub Release

on:
    workflow_dispatch:
        inputs:
            dry-run:
                description: Validate and upload workflow artifacts without creating a release
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: release-extension
    cancel-in-progress: false

jobs:
    build:
        if: ${{ github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run checks before packaging
              run: |
                  npm run compile
                  npm run lint
                  npm run check-format
                  npm run test:unit
                  npm run test:headless

            - name: Build for Chrome
              run: npm run build

            - name: Build for Firefox
              run: npm run build:firefox

            - name: Check package and manifest versions
              id: version
              run: |
                  version=$(jq -r '.version' package.json)
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  test "$(jq -r '.version' package-lock.json)" = "$version"
                  test "$(jq -r '.packages[""].version' package-lock.json)" = "$version"
                  test "$(jq -r '.version' .output/chrome-mv3/manifest.json)" = "$version"
                  test "$(jq -r '.version' .output/firefox-mv2/manifest.json)" = "$version"
                  test -s "docs/release-notes-$version.md"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Zip Chrome Extension
              run: |
                  cd .output/chrome-mv3 || exit 1
                  zip -r ../../extension-chrome.zip .
                  cd ../.. || exit 1

            - name: Zip Firefox Extension
              run: |
                  cd .output/firefox-mv2 || exit 1
                  zip -r ../../extension-firefox.zip .
                  cd ../.. || exit 1

            - name: Inspect production ZIPs
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  for browser in chrome firefox; do
                    archive="extension-$browser.zip"
                    unzip -t "$archive"
                    unzip -Z1 "$archive" > entries.txt
                    test "$(sort entries.txt | uniq -d | wc -l)" -eq 0
                    # Reject development files and unsafe paths; never extract archive paths.
                    if grep -Ei '(^/|(^|/)\.\.(/|$)|\\|\.(ts|tsx|map)$|(^|/)(node_modules|tests?|\.git|\.env)(/|$))' entries.txt; then
                      echo '::error::Unexpected ZIP contents'; exit 1
                    fi
                    unzip -p "$archive" manifest.json > validated-manifest.json
                    test "$(jq -r '.version' validated-manifest.json)" = "$VERSION"
                    test "$(jq -r '.name' validated-manifest.json)" = 'PR Tracker'
                    if test "$browser" = chrome; then
                      test "$(jq -r '.manifest_version' validated-manifest.json)" = 3
                    else
                      test "$(jq -r '.manifest_version' validated-manifest.json)" = 2
                      test "$(jq -r '.browser_specific_settings.gecko.id' validated-manifest.json)" = '{dabd690e-283a-4c0a-98de-3fc963365d13}'
                    fi
                    for asset in branding/watchtower.png icons/icon-16.png icons/icon-32.png icons/icon-48.png icons/icon-128.png; do
                      grep -Fx "$asset" entries.txt
                    done
                    jq -r '[(.icons // {}), (.action.default_icon // .browser_action.default_icon // {})] | .[] | if type == "string" then . else .[] end' validated-manifest.json > icon-paths.txt
                    while IFS= read -r asset; do
                      grep -Fx "${asset#/}" entries.txt
                    done < icon-paths.txt
                    if unzip -p "$archive" '*.js' | grep -E 'TEST_RESET_BACKGROUND_STATE|design-system-showcase'; then
                      echo '::error::Test code in production ZIP'; exit 1
                    fi
                  done

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: extension-builds
                  path: |
                      extension-chrome.zip
                      extension-firefox.zip
                  if-no-files-found: error

    release:
        needs: build
        if: ${{ !inputs.dry-run && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: extension-builds

            - name: Create version tag and GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.build.outputs.version }}
              run: |
                  # Fail closed on retries, stale main, or an existing tag/release.
                  test "$GITHUB_RUN_ATTEMPT" = 1
                  test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
                  tag="v$VERSION"
                  for path in "git/ref/tags/$tag" "releases/tags/$tag"; do
                    status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                      -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$path")
                    test "$status" = 404 || { echo "::error::Tag/release already exists or lookup failed (HTTP $status)"; exit 1; }
                  done
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
                  gh release create "$tag" extension-chrome.zip extension-firefox.zip \
                    --verify-tag --target "$GITHUB_SHA" --title "PR Tracker $VERSION" \
                    --notes-file "docs/release-notes-$VERSION.md"
