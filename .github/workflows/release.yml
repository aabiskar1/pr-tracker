name: Release Extension

on:
    workflow_dispatch:
        inputs:
            dry-run:
                description: 'Dry Run (Build and Zip only, no release or store submission)'
                type: boolean
                required: false
                default: false

permissions:
    contents: read

concurrency:
    group: release-extension
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run checks before packaging
              run: |
                  npm run compile
                  npm run lint
                  npm run check-format
                  npm run test:unit
                  npm run test:headless

            - name: Build for Chrome
              run: npm run build

            - name: Build for Firefox
              run: npm run build:firefox

            - name: Check package and manifest versions
              id: version
              run: |
                  version=$(jq -r '.version' package.json)
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  test "$(jq -r '.version' package-lock.json)" = "$version"
                  test "$(jq -r '.packages[""].version' package-lock.json)" = "$version"
                  test "$(jq -r '.version' .output/chrome-mv3/manifest.json)" = "$version"
                  test "$(jq -r '.version' .output/firefox-mv2/manifest.json)" = "$version"
                  test -s "docs/release-notes-$version.md"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Zip Chrome Extension
              run: |
                  cd .output/chrome-mv3
                  zip -r ../../extension-chrome.zip .
                  cd ../..

            - name: Zip Firefox Extension
              run: |
                  cd .output/firefox-mv2
                  zip -r ../../extension-firefox.zip .
                  cd ../..

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: extension-builds
                  path: |
                      extension-chrome.zip
                      extension-firefox.zip

    release:
        needs: build
        if: ${{ github.event.inputs.dry-run != 'true' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: extension-builds

            - name: Create version tag and GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.build.outputs.version }}
              run: |
                  # Fail closed on retries, stale main, or an existing tag/release.
                  test "$GITHUB_RUN_ATTEMPT" = 1
                  test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
                  tag="v$VERSION"
                  for path in "git/ref/tags/$tag" "releases/tags/$tag"; do
                    status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                      -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$path")
                    test "$status" = 404 || { echo "::error::Tag/release already exists or lookup failed (HTTP $status)"; exit 1; }
                  done
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
                  gh release create "$tag" extension-chrome.zip extension-firefox.zip \
                    --verify-tag --target "$GITHUB_SHA" --title "PR Tracker $VERSION" \
                    --notes-file "docs/release-notes-$VERSION.md"

    publish-chrome:
        needs: release
        if: ${{ github.event.inputs.dry-run != 'true' && github.run_attempt == 1 }}
        environment: browser-stores
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: extension-builds

            - name: Upload to Chrome Web Store
              uses: mnao305/chrome-extension-upload@v6.0.0
              with:
                  file-path: extension-chrome.zip
                  extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
                  client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
                  client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  refresh-token: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
                  publish: true

    publish-firefox:
        needs: release
        if: ${{ github.event.inputs.dry-run != 'true' && github.run_attempt == 1 }}
        environment: browser-stores
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: extension-builds

            - name: Create Artifacts Directory
              run: mkdir -p web-ext-artifacts

            - name: Sign and Upload to Firefox Add-ons
              uses: kewisch/action-web-ext@v1
              with:
                  cmd: sign
                  source: extension-firefox.zip
                  channel: listed
                  apiKey: ${{ secrets.FIREFOX_API_KEY }}
                  apiSecret: ${{ secrets.FIREFOX_API_SECRET }}
                  timeout: 900000
