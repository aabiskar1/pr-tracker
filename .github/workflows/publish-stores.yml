name: Publish to Stores
run-name: Publish ${{ inputs.release-tag }} to ${{ inputs.store }}

on:
    workflow_dispatch:
        inputs:
            release-tag:
                description: Existing published release tag (for example v1.0.22)
                required: true
                type: string
            store:
                description: Store to submit to
                required: true
                type: choice
                default: both
                options: [chrome, firefox, both]
            confirm-store-status:
                description: I checked the selected store dashboards and this version has not been accepted
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    inspect:
        if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
        runs-on: ubuntu-24.04
        outputs:
            snapshot: ${{ steps.validate.outputs.snapshot }}
        steps:
            # Dispatch is restricted to main; pin all jobs to that workflow revision.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Confirm store dashboard verification
              env:
                  CONFIRMED: ${{ inputs.confirm-store-status }}
              run: test "$CONFIRMED" = true
            - name: Validate release and original assets
              id: validate
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.release-tag }}
                  STORE: ${{ inputs.store }}
              run: node scripts/validate-release.mjs

    publish-chrome:
        name: Publish chrome ${{ inputs.release-tag }}
        needs: inspect
        if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && (inputs.store == 'chrome' || inputs.store == 'both') }}
        runs-on: ubuntu-24.04
        environment: browser-stores
        concurrency:
            group: store-chrome-${{ inputs.release-tag }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Revalidate original release and assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.release-tag }}
                  STORE: chrome
                  EXPECTED_SNAPSHOT: ${{ needs.inspect.outputs.snapshot }}
              run: node scripts/validate-release.mjs
            - name: Verify Chrome submission target
              env:
                  EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
              run: test "$EXTENSION_ID" = kfeglmkcicfmegclihokchplngcokgil
            - name: Submit to chrome
              uses: mnao305/chrome-extension-upload@v6.0.0
              with:
                  file-path: extension-chrome.zip
                  extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
                  client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
                  client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  refresh-token: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
                  publish: true
            - name: Report Chrome result
              if: ${{ always() }}
              env:
                  RESULT: ${{ job.status }}
              run: |
                  printf 'Chrome publication job: **%s**. Inspect the submission step and store dashboard before retrying.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"

    publish-firefox:
        name: Publish firefox ${{ inputs.release-tag }}
        needs: inspect
        if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && (inputs.store == 'firefox' || inputs.store == 'both') }}
        runs-on: ubuntu-24.04
        environment: browser-stores
        concurrency:
            group: store-firefox-${{ inputs.release-tag }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Revalidate original release and assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.release-tag }}
                  STORE: firefox
                  EXPECTED_SNAPSHOT: ${{ needs.inspect.outputs.snapshot }}
              run: node scripts/validate-release.mjs
            - name: Create Artifacts Directory
              run: mkdir -p web-ext-artifacts
            - name: Submit to firefox
              uses: kewisch/action-web-ext@v1
              with:
                  cmd: sign
                  source: extension-firefox.zip
                  channel: listed
                  apiKey: ${{ secrets.FIREFOX_API_KEY }}
                  apiSecret: ${{ secrets.FIREFOX_API_SECRET }}
                  timeout: 900000
            - name: Report Firefox result
              if: ${{ always() }}
              env:
                  RESULT: ${{ job.status }}
              run: |
                  printf 'Firefox publication job: **%s**. Inspect the submission step and store dashboard before retrying.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
