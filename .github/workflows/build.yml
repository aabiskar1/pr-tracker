name: buildandtest

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    verify:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Verify Builds (Chrome & Firefox)
              run: npm run build:all

            - name: Run Unit Tests
              run: npm run test:unit

            - name: Run Deterministic Chrome E2E Tests
              run: npm run test:headless
